version: "3.9"

services:

  #################################################
  # PostgreSQL
  #################################################
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always

    environment:
      POSTGRES_DB: stockdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stockdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  #################################################
  # Kafka (KRaft Mode)
  #################################################
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    restart: always

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  #################################################
  # Order Service
  #################################################
  order-service:
    build:
      context: ./services/order-service

    container_name: order-service

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    ports:
      - "8081:8081"

    environment:
      SERVER_PORT: 8081

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stockdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      DDL_AUTO: update
      SHOW_SQL: true

  #################################################
  # Risk Service
  #################################################
  risk-service:
    build:
      context: ./services/risk-service

    container_name: risk-service

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    ports:
      - "8082:8082"

    environment:
      SERVER_PORT: 8082

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stockdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      DDL_AUTO: update
      SHOW_SQL: true

  #################################################
  # Portfolio Service
  #################################################
  portfolio-service:
    build:
      context: ./services/portfolio-service

    container_name: portfolio-service

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    ports:
      - "8083:8083"

    environment:
      SERVER_PORT: 8083

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stockdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      DDL_AUTO: update
      SHOW_SQL: true

  #################################################
  # Notification Service
  #################################################
  notification-service:
    build:
      context: ./services/notification-service

    container_name: notification-service

    depends_on:
      kafka:
        condition: service_healthy

    ports:
      - "8084:8084"

    environment:
      SERVER_PORT: 8084

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

volumes:
  postgres-data: